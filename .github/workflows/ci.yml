name: Apex Operations API — CI/CD Pipeline

on:
  # Trigger automatically on pushes to main branches for code/config changes only
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

  # Trigger on Pull Requests targeting main
  pull_request:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

  # Allow manual execution via the "Run workflow" button in GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # 1. Code Quality & Linting
  # ============================================================================
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Checks
        run: ruff check app tests

  # ============================================================================
  # 2. Automated Test Suite (6 Checks)
  # ============================================================================
  test:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Application & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite with Coverage
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # ============================================================================
  # 3. Security Vulnerability Scan
  # ============================================================================
  security-scan:
    name: Dependency & Filesystem Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Run Aqua Security Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # Audit mode for reporting

  # ============================================================================
  # 4. Gated Container Packaging & Release
  # ============================================================================
  # CRITICAL GATE: Only triggers if both 'test' and 'security-scan' succeed!
  # If tests fail, this job is BLOCKED and never runs.
  build-container:
    name: Build & Package Container Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata (Git SHA & Semantic Version)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ameen2607/apex-arabia
          tags: |
            type=sha,format=short
            type=raw,value=v1.0.0
            type=raw,value=latest
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' || secrets.DOCKERHUB_TOKEN == '' }}

      - name: Scan Built Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ameen2607/apex-arabia:v1.0.0
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Pipeline Success Summary
        run: |
          echo "=========================================================="
          echo " CI/CD Pipeline Passed All Quality & Security Gates"
          echo " Pushed Image: ameen2607/apex-arabia:v1.0.0"
          echo " Deployment Gate: READY FOR RELEASE"
          echo "=========================================================="
